<script src="config.js"></script>
<script>
'use strict';
// Mặc Tiên Lộ: an idle cultivation game drawn as one ink-wash painting.
// Keep the fixed step, the clock hook, window.game and the play and figures scenes.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds
const W = 1280, H = 720;        // logical size
const PIXEL = false;
const FONT = '"Noto Serif", "Times New Roman", Georgia, serif';
const TITLE = 'Mặc Tiên Lộ';
const CONTROLS = [
  'Bấm "Thiền định" hoặc Space: hút linh khí',
  'Bấm một nguồn tu luyện hoặc phím 1–8: mua',
  'Bấm "Đột phá" hoặc B: thử lên cảnh giới mới',
  'P: tạm dừng · M: tắt tiếng',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
// Visual-only randomness (mist, particles): its own seeded stream so gameplay rolls stay put.
let vseed = 777;
function vrng() {
  vseed = (vseed + 0x6D2B79F5) | 0;
  let t = Math.imul(vseed ^ (vseed >>> 15), vseed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = [];

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let viewScale = 1;
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = k;
  const r = s * (devicePixelRatio || 1);
  viewScale = s;
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = true;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', weight = '') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}

// ---- Palette: ink on old paper, cinnabar for seals ------------------------------------
const INK = '#1d1a17', INK2 = '#4a443d', PAPER = '#efe6d2', PAPER2 = '#e4d8bd', CINNABAR = '#b8322a';
const REALMS = ['Phàm Nhân', 'Luyện Khí', 'Trúc Cơ', 'Kết Đan', 'Nguyên Anh', 'Hóa Thần',
  'Luyện Hư', 'Hợp Thể', 'Đại Thừa', 'Độ Kiếp'];
const ASCEND = 'Phi Thăng';
// Aura colour per realm: white, green, teal, blue, gold, orange, crimson, purple, violet, pale gold.
const AURA = ['#d8d2c4', '#7fae7a', '#5fa89c', '#5b84c4', '#d6a843', '#e0803a', '#c8483c',
  '#9a56b8', '#7b5fd6', '#f2d98a'];

// ---- Sources ---------------------------------------------------------------------------
const SOURCES = [
  { name: 'Thổ Nạp Quyết', unlock: 0, draw: drawScroll },
  { name: 'Linh Thảo Viên', unlock: 0, draw: drawHerb },
  { name: 'Tụ Linh Liên', unlock: 1, draw: drawLotus },
  { name: 'Luyện Đan Lô', unlock: 2, draw: drawFurnace },
  { name: 'Linh Mạch', unlock: 3, draw: drawCrystal },
  { name: 'Tụ Linh Trận', unlock: 4, draw: drawArray },
  { name: 'Ngự Phi Kiếm', unlock: 5, draw: drawSword },
  { name: 'Tiên Hạc', unlock: 6, draw: drawCrane },
];
const MILESTONES = [10, 25, 50, 100, 200];
const srcCost0 = i => tune['src' + (i + 1) + '_cost'];
const srcRate0 = i => tune['src' + (i + 1) + '_rate'];

// ---- Number names: short Vietnamese ------------------------------------------------------
const UNITS = [[1e18, 'tỉ tỉ'], [1e15, 'triệu tỉ'], [1e12, 'nghìn tỉ'], [1e9, 'tỉ'], [1e6, 'triệu'], [1e3, 'nghìn']];
function fmt(n) {
  if (!isFinite(n)) return 'vô lượng';
  if (n < 0) return '-' + fmt(-n);
  if (n >= 1e21) return n.toExponential(2).replace('.', ',');
  for (const [u, name] of UNITS) {
    if (n >= u) {
      const v = n / u;
      const s = v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v).toString();
      return s.replace('.', ',') + ' ' + name;
    }
  }
  if (n < 10) return (Math.floor(n * 10) / 10).toString().replace('.', ',');
  return Math.floor(n).toString();
}
function fmtTime(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  if (h > 0) return `${h} giờ ${m} phút`;
  if (m > 0) return `${m} phút ${s} giây`;
  return `${s} giây`;
}

// ---- Input -------------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
const clicks = []; // pointer presses in logical coords, handled on the next step
const pointer = { x: -1, y: -1 };
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
canvas.addEventListener('pointerdown', e => { startAudio(); const p = toLogical(e); clicks.push(p); });
canvas.addEventListener('pointermove', e => { const p = toLogical(e); pointer.x = p.x; pointer.y = p.y; });
addEventListener('blur', () => down.clear());
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

// ---- Audio -----------------------------------------------------------------------------
let audio = null, muted = false;
function startAudio() {
  try {
    if (!audio) {
      const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
      const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
      out.connect(ac.destination); audio = { ac, out };
    }
    if (audio.ac.state === 'suspended') audio.ac.resume();
  } catch (e) { /* no audio */ }
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'sine', vol = 0.25, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur + 0.02);
}
const PENTA = [262, 294, 330, 392, 440, 523, 587, 659, 784, 880];
const sfx = {
  click() { tone(PENTA[Math.floor(vrng() * 5) + 3], 0.18, 'sine', 0.12); },
  buy() { tone(196, 0.12, 'triangle', 0.25); tone(392, 0.2, 'sine', 0.12, 0.03); },
  no() { tone(110, 0.12, 'square', 0.06); },
  milestone() { [659, 784, 988, 1319].forEach((f, i) => tone(f, 0.5, 'sine', 0.14, i * 0.07)); },
  success() { [262, 330, 392, 523, 659, 784].forEach((f, i) => tone(f, 0.7, 'triangle', 0.16, i * 0.09)); },
  fail() { tone(98, 0.8, 'sawtooth', 0.12); tone(73, 1.0, 'sine', 0.2, 0.1); },
  prestige() { [523, 392, 330, 262, 196, 262, 392, 523, 784].forEach((f, i) => tone(f, 0.6, 'sine', 0.13, i * 0.1)); },
};

// ---- State and rules ---------------------------------------------------------------------
let scene, state;
const SAVE_KEY = 'mac-tien-lo-v1';
function freshState() {
  return {
    t: 0, score: 0, gained: '',
    lk: 0,            // linh khí: spent on sources
    tuvi: 0,          // tu vi: filled by the same flow, spent on breakthroughs
    realm: 0,
    owned: SOURCES.map(() => 0),
    exp: 0,           // Kinh nghiệm: failures at this realm
    tamma: 0,         // seconds of tâm ma left
    daotam: 0,        // Đạo tâm: carries over every Chuyển thế
    lives: 0,         // how many Chuyển thế
    lifeLK: 0,        // linh khí earned this life
    totalTime: 0,     // seconds played over all lives
    lifeTime: 0,
    fails: 0, tries: 0,
    won: false,
    shownLK: 0, shownTV: 0,
    fx: [], parts: [], floats: [], banner: null, away: null,
    saveT: 0, shake: 0, flash: null,
  };
}
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = freshState();
}
function load() {
  if (params.get('fresh') === '1') return false;
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  if (!raw) return false;
  try {
    const d = JSON.parse(raw);
    const s = freshState();
    for (const k of ['lk', 'tuvi', 'realm', 'exp', 'tamma', 'daotam', 'lives', 'lifeLK', 'totalTime', 'lifeTime', 'fails', 'tries', 'won']) if (d[k] !== undefined) s[k] = d[k];
    if (Array.isArray(d.owned)) s.owned = SOURCES.map((_, i) => d.owned[i] || 0);
    if (typeof d.seed === 'number') seed = d.seed;
    state = s;
    // Bế quan: what was earned while the tab was closed (the one place the real clock is read).
    const away = Math.min((Date.now() - (d.time || Date.now())) / 1000, tune.offline_cap_h * 3600);
    if (away >= tune.offline_min_s && !s.won) {
      const g = production(true) * away * tune.offline_rate;
      earn(g);
      s.away = { secs: away, gain: g, t: 0 };
    }
    s.shownLK = s.lk; s.shownTV = s.tuvi;
    return true;
  } catch (e) { return false; }
}
function save() {
  if (!state) return;
  const s = state;
  const d = { time: Date.now(), seed };
  for (const k of ['lk', 'tuvi', 'realm', 'owned', 'exp', 'tamma', 'daotam', 'lives', 'lifeLK', 'totalTime', 'lifeTime', 'fails', 'tries', 'won']) d[k] = s[k];
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); } catch (e) { /* private mode: no save */ }
}
function wipeSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } }
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
addEventListener('beforeunload', () => { if (scene === 'play' || scene === 'pause') save(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && (scene === 'play' || scene === 'pause')) save(); });

function milestonesHit(n) { return MILESTONES.filter(m => n >= m).length; }
function nextMilestone(n) { return MILESTONES.find(m => n < m); }
function srcCost(i) { return srcCost0(i) * Math.pow(tune.cost_growth, state.owned[i]); }
function srcEach(i) { // linh khí per second from one copy, with every multiplier but tâm ma
  return srcRate0(i) * Math.pow(tune.milestone_mult, milestonesHit(state.owned[i])) * globalMult(true);
}
function globalMult(noTamma) {
  let m = Math.pow(tune.realm_mult, state.realm) * (1 + state.daotam * tune.daotam_bonus);
  if (!noTamma && state.tamma > 0) m *= tune.tamma_mult;
  return m;
}
function production(noTamma) {
  let p = 0;
  for (let i = 0; i < SOURCES.length; i++) {
    if (!state.owned[i]) continue;
    p += srcRate0(i) * state.owned[i] * Math.pow(tune.milestone_mult, milestonesHit(state.owned[i]));
  }
  return p * globalMult(noTamma);
}
function clickGain() { return tune.click_base * globalMult() + tune.click_share * production(); }
function threshold(r = state.realm) { return tune.tuvi_base * Math.pow(tune.tuvi_growth, r); }
function baseChance(r = state.realm) {
  if (r === 0) return 1;
  return Math.max(tune.chance_min, tune.chance_start - tune.chance_drop * (r - 1));
}
function chance() {
  const T = threshold();
  const over = Math.max(0, state.tuvi / T - 1);
  const c = baseChance() + tune.overflow_bonus * over + tune.exp_bonus * state.exp;
  return Math.min(Math.max(tune.chance_cap, baseChance()), c);
}
function canBreak() { return state.tuvi >= threshold() && !state.won; }
function prestigeGain() { return Math.floor(Math.sqrt(state.lifeLK / tune.prestige_div)); }
function canPrestige() { return state.realm >= tune.prestige_min_realm && prestigeGain() >= 1 && !state.won; }
function sourceVisible(i) { return SOURCES[i].unlock <= state.realm || state.owned[i] > 0; }

function earn(g) { state.lk += g; state.tuvi += g; state.lifeLK += g; }

// Where each source stands in the painting.
const SPOT = [
  { x: 150, y: 590, s: 1 },    // scroll on its little table
  { x: 262, y: 625, s: 1 },    // herb garden
  { x: 575, y: 630, s: 1 },    // lotus pond
  { x: 655, y: 520, s: 1 },    // furnace
  { x: 92, y: 470, s: 1 },     // spirit vein on the cliff
  { x: 380, y: 568, s: 1 },    // array under the cultivator
  { x: 380, y: 330, s: 1 },    // sword circling above
  { x: 560, y: 175, s: 1 },    // crane in the sky
];
const HERO = { x: 380, y: 520 };

function meditate() {
  const g = clickGain();
  earn(g);
  state.floats.push({ x: HERO.x + (vrng() - 0.5) * 60, y: HERO.y - 120, t: 0, str: '+' + fmt(g), c: INK });
  for (let k = 0; k < 4; k++) spawnWisp(HERO.x + (vrng() - 0.5) * 160, HERO.y - 40 - vrng() * 120, true);
  sfx.click();
  events.push({ type: 'meditate', gain: g });
}
function buy(i) {
  if (!sourceVisible(i)) return;
  const c = srcCost(i);
  if (state.lk < c) { sfx.no(); return; }
  state.lk -= c;
  const before = milestonesHit(state.owned[i]);
  state.owned[i]++;
  state.shownLK = Math.min(state.shownLK, state.lk);
  const sp = SPOT[i];
  state.fx.push({ type: 'ring', x: sp.x, y: sp.y - 20, t: 0, dur: 0.6, c: INK2, r: 50 });
  if (milestonesHit(state.owned[i]) > before) {
    state.fx.push({ type: 'ring', x: sp.x, y: sp.y - 20, t: 0, dur: 1.2, c: AURA[Math.max(1, state.realm)], r: 140 });
    state.floats.push({ x: sp.x, y: sp.y - 70, t: 0, str: `${SOURCES[i].name} ×${tune.milestone_mult}!`, c: CINNABAR, big: true });
    sfx.milestone();
    events.push({ type: 'milestone', src: i, owned: state.owned[i] });
  } else sfx.buy();
  events.push({ type: 'buy', src: i, owned: state.owned[i] });
}
function breakthrough() {
  if (!canBreak()) { sfx.no(); return; }
  const c = chance();
  state.tries++;
  const roll = rng();
  if (roll < c) {
    state.realm++;
    state.tuvi = 0; state.exp = 0; state.tamma = 0;
    state.shownTV = 0;
    if (state.realm >= REALMS.length) { // Độ Kiếp passed: Phi Thăng
      state.realm = REALMS.length - 1;
      state.won = true;
      state.gained = `${ASCEND} sau ${fmtTime(state.totalTime)} · ${state.lives} lần chuyển thế`;
      state.flash = { t: 0, dur: 2.5, c: '#fff8dc' };
      sfx.success();
      events.push({ type: 'ascend' });
      save();
      scene = 'results';
      return;
    }
    state.flash = { t: 0, dur: 1.2, c: '#fffdf2' };
    state.fx.push({ type: 'ring', x: HERO.x, y: HERO.y - 60, t: 0, dur: 1.6, c: AURA[state.realm], r: 420 });
    if (state.realm >= 4) state.fx.push({ type: 'bolt', t: 0, dur: 0.6, seed: Math.floor(vrng() * 1e6) });
    state.banner = { t: 0, dur: 3.2, str: `Đột phá thành công · ${REALMS[state.realm]}`, sub: `Mọi nguồn tu luyện ×${tune.realm_mult}` + (SOURCES.some(s => s.unlock === state.realm) ? ` · mở ${SOURCES.find(s => s.unlock === state.realm).name}` : ''), c: INK };
    sfx.success();
    events.push({ type: 'breakthrough', ok: true, realm: state.realm, chance: c });
  } else {
    state.fails++;
    state.tuvi *= 1 - tune.fail_loss;
    state.shownTV = Math.min(state.shownTV, state.tuvi);
    state.exp++;
    state.tamma = tune.tamma_time;
    state.shake = 0.6;
    state.flash = { t: 0, dur: 0.9, c: '#2a1414' };
    state.fx.push({ type: 'bolt', t: 0, dur: 0.5, seed: Math.floor(vrng() * 1e6), dark: true });
    state.banner = { t: 0, dur: 3.2, str: 'Đột phá thất bại · tâm ma xâm nhập', sub: `Mất ${Math.round(tune.fail_loss * 100)}% tu vi · lần sau +${Math.round(tune.exp_bonus * 100)}% cơ hội`, c: CINNABAR };
    sfx.fail();
    events.push({ type: 'breakthrough', ok: false, realm: state.realm, chance: c });
  }
}
function prestige() {
  if (!canPrestige()) { sfx.no(); return; }
  const g = prestigeGain();
  const keep = { daotam: state.daotam + g, lives: state.lives + 1, totalTime: state.totalTime, fails: state.fails, tries: state.tries };
  const s = freshState();
  Object.assign(s, keep);
  state = s;
  state.flash = { t: 0, dur: 1.8, c: '#f6efe0' };
  state.banner = { t: 0, dur: 4, str: `Chuyển thế · kiếp thứ ${state.lives + 1}`, sub: `Đạo tâm ${state.daotam}: mọi nguồn +${Math.round(state.daotam * tune.daotam_bonus * 100)}%`, c: INK };
  sfx.prestige();
  events.push({ type: 'prestige', daotam: state.daotam });
  save();
}

// ---- Layout of the right-hand panel and the painting buttons -----------------------------
const PANEL = { x: 778, y: 14, w: 488, h: 692 };
const BTN_MEDITATE = { x: 280, y: 648, w: 200, h: 50 };
const BTN_BREAK = { x: PANEL.x + 20, y: 196, w: PANEL.w - 40, h: 54 };
const BTN_PRESTIGE = { x: 18, y: 652, w: 210, h: 50 };
const ROW0 = 300, ROWH = 46;
function rowRect(k) { return { x: PANEL.x + 14, y: ROW0 + k * ROWH, w: PANEL.w - 28, h: ROWH - 6 }; }
function visibleRows() { // indices shown in the list: unlocked ones plus the next locked one
  const out = [];
  for (let i = 0; i < SOURCES.length; i++) {
    if (sourceVisible(i)) out.push({ i, locked: false });
    else { out.push({ i, locked: true }); break; }
  }
  return out;
}

// ---- Effects ---------------------------------------------------------------------------
function spawnWisp(x, y, fast) {
  state.parts.push({ x, y, t: 0, dur: fast ? 0.9 : 2.5 + vrng() * 1.5, sx: x, sy: y, wob: vrng() * 6.28 });
}
function updateFx(dt) {
  const s = state;
  for (const f of s.fx) f.t += dt;
  s.fx = s.fx.filter(f => f.t < f.dur);
  for (const f of s.floats) { f.t += dt; f.y -= 40 * dt; }
  s.floats = s.floats.filter(f => f.t < 1.4);
  for (const p of s.parts) p.t += dt;
  s.parts = s.parts.filter(p => p.t < p.dur);
  // idle wisps drift toward the cultivator, more as the flow grows
  const flow = Math.min(6, 0.6 + Math.log10(1 + production()) * 0.7);
  if (!CHEAP && vrng() < flow * dt && s.parts.length < 60) {
    const a = vrng() * Math.PI * 2;
    spawnWisp(HERO.x + Math.cos(a) * 300, HERO.y - 80 + Math.sin(a) * 180, false);
  }
  if (s.banner) { s.banner.t += dt; if (s.banner.t > s.banner.dur) s.banner = null; }
  if (s.flash) { s.flash.t += dt; if (s.flash.t > s.flash.dur) s.flash = null; }
  if (s.away) { s.away.t += dt; if (s.away.t > 7) s.away = null; }
  s.shake = Math.max(0, s.shake - dt);
  const k = Math.min(1, dt * tune.count_speed);
  s.shownLK += (s.lk - s.shownLK) * k; if (s.lk < s.shownLK) s.shownLK = s.lk;
  s.shownTV += (s.tuvi - s.shownTV) * k; if (s.tuvi < s.shownTV) s.shownTV = s.tuvi;
}

// ---- Drawing: the painting ---------------------------------------------------------------
// Paper grain and mountains are fixed per seed: built once into an offscreen canvas.
let paperCanvas = null;
function buildPaper() {
  paperCanvas = document.createElement('canvas');
  paperCanvas.width = W; paperCanvas.height = H;
  const g = paperCanvas.getContext('2d');
  g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
  const save = vseed; vseed = 4242;
  for (let i = 0; i < (CHEAP ? 1500 : 9000); i++) {
    const x = vrng() * W, y = vrng() * H, a = vrng() * 0.06;

      ctx.fillStyle = 'rgba(214,168,67,0.95)'; ctx.fillRect(mx, my, mw * f, 8);
      ctx.strokeStyle = 'rgba(29,26,23,0.6)'; ctx.lineWidth = 1; ctx.strokeRect(mx, my, mw, 8);
      text(`${nm}: ×${tune.milestone_mult}`, mx - 6, my + 5, 14, INK2, 'right');
    }
  });
  // footer
  text(`Đã tu ${fmtTime(s.totalTime)} · đột phá ${s.tries - s.fails}/${s.tries}`, P.x + P.w / 2, P.y + P.h - 20, 14, INK2);
}

// ---- Scenes ----------------------------------------------------------------------------
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      ctx.drawImage(paperCanvas, 0, 0);
      const t = state.t;
      const items = [
        ['Người tu', () => { drawAura(150, 300, 0.8, t, 3, 2); drawCultivator(150, 300, 0.8, t, 3, 0); }],
        ['Tâm ma', () => drawTamMa(400, 240, 1.4, t, 0)],
        ['Thổ Nạp Quyết', () => drawScroll(620, 270, 1.4)],
        ['Linh Thảo Viên', () => drawHerb(860, 290, 1.4)],
        ['Tụ Linh Liên', () => drawLotus(1100, 290, 1.1)],
        ['Luyện Đan Lô', () => drawFurnace(150, 600, 1.3, t)],
        ['Linh Mạch', () => drawCrystal(400, 600, 1.4)],
        ['Tụ Linh Trận', () => drawArray(620, 590, 0.8, t, AURA[4])],
        ['Ngự Phi Kiếm', () => drawSword(860, 560, 1.5, -0.3)],
        ['Tiên Hạc', () => drawCrane(1090, 560, 1.2, t)],
      ];
      const pos = [[150, 340], [400, 340], [620, 340], [860, 340], [1100, 340], [150, 650], [400, 650], [620, 650], [860, 650], [1100, 650]];
      items.forEach(([name, fn], k) => { fn(); text(name, pos[k][0], pos[k][1], 20, INK, 'center', 'bold'); });
    },
  },
  title: {
    update() {
      const go = pressed('Enter') || pressed('Space') || clicks.length > 0;
      clicks.length = 0;
      if (go) {
        if (!load()) reset();
        scene = 'play';
        events.push({ type: 'start' });
      }
    },
    draw() {
      const t = clock.now();
      ctx.drawImage(paperCanvas, 0, 0);
      drawSun(980, 150, 60);
      ctx.save(); ctx.scale(W / 766, 1); drawMountains(766, null); ctx.restore();
      drawCloud(300, 160, 1.2, 1); drawCloud(1000, 300, 0.9, 0.9);
      drawAura(W / 2, 560, 1, t, 1, 2); drawCultivator(W / 2, 560, 1, t, 1, 0);
      drawSeal(W / 2 - 300, 60, 64, 190, ['Mặc', 'Tiên', 'Lộ'], 22);
      text(TITLE, W / 2 + 40, 120, 72, INK, 'center', 'bold');
      text('con đường tu tiên vẽ bằng mực', W / 2 + 40, 175, 22, INK2);
      ctx.fillStyle = 'rgba(248,242,228,0.88)'; ctx.fillRect(W / 2 - 330, 218, 660, 170);
      ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.strokeRect(W / 2 - 330, 218, 660, 170);
      CONTROLS.forEach((c, i) => text(c, W / 2, 248 + i * 36, 20, INK));
      const pulse = 0.6 + Math.sin(t * 3) * 0.4;
      ctx.globalAlpha = pulse;
      text(hasSave() ? 'Bấm hoặc nhấn Enter để tiếp tục tu luyện' : 'Bấm hoặc nhấn Enter để bắt đầu', W / 2, H - 40, 26, CINNABAR, 'center', 'bold');
      ctx.globalAlpha = 1;
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; clicks.length = 0; return; }
      const s = state;
      s.t += dt; s.totalTime += dt; s.lifeTime += dt;
      // pointer presses
      while (clicks.length) {
        const p = clicks.shift();
        if (s.away && p.x < 766) { s.away = null; continue; }
        if (inRect(p, BTN_MEDITATE) || (p.x < 766 && Math.hypot(p.x - HERO.x, p.y - (HERO.y - 70)) < 90)) meditate();
        else if (inRect(p, BTN_BREAK)) breakthrough();
        else if (inRect(p, BTN_PRESTIGE) && s.realm >= tune.prestige_min_realm) prestige();
        else visibleRows().forEach(({ i, locked }, k) => { if (!locked && inRect(p, rowRect(k))) buy(i); });
        if (scene !== 'play') return;
      }
      if (pressed('Space')) meditate();
      if (pressed('KeyB')) breakthrough();
      if (scene !== 'play') return;
      for (let i = 0; i < SOURCES.length; i++) if (pressed('Digit' + (i + 1)) || pressed('Numpad' + (i + 1))) buy(i);
      // the flow
      earn(production() * dt);
      if (state.tamma > 0) state.tamma = Math.max(0, state.tamma - dt);
      updateFx(dt);
      state.score = state.realm;
      state.saveT += dt;
      if (state.saveT >= tune.autosave_s) { state.saveT = 0; save(); }
    },
    draw() {
      drawPainting(state.t, true);
      drawPanel();
    },
  },
  pause: {
    update() {
      clicks.length = 0;
      if (pressed('KeyP') || pressed('Escape')) scene = 'play';
      if (pressed('KeyR') && down.has('ShiftLeft')) { wipeSave(); reset(); scene = 'title'; }
    },
    draw() {
      scenes.play.draw();
      ctx.fillStyle = 'rgba(29,26,23,0.55)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = PAPER; ctx.fillRect(W / 2 - 280, H / 2 - 110, 560, 220);
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.strokeRect(W / 2 - 280, H / 2 - 110, 560, 220);
      text('Tạm dừng', W / 2, H / 2 - 60, 44, INK, 'center', 'bold');
      text('P hoặc Esc: tu tiếp', W / 2, H / 2, 22, INK2);
      text('Shift + R: xóa toàn bộ, tu lại từ đầu', W / 2, H / 2 + 40, 18, CINNABAR);
      text('Tiến độ tự lưu trong trình duyệt', W / 2, H / 2 + 76, 16, INK2);
    },
  },
  results: {
    update(dt) {
      state.t += dt; updateFx(dt);
      const go = pressed('Enter') || clicks.length > 0; clicks.length = 0;
      if (go) { wipeSave(); reset(); scene = 'title'; }
    },
    draw() {
      const t = state.t;
      ctx.drawImage(paperCanvas, 0, 0);
      ctx.save(); ctx.scale(W / 766, 1); drawMountains(766, AURA[9]); ctx.restore();
      // ascending: the cultivator rises into the clouds
      const rise = Math.min(1, t / 6) * 160;
      drawAura(W / 2, 600 - rise, 1.3, t, 9, 8);
      drawCultivator(W / 2, 600 - rise, 1, t, 9, 0);
      drawCloud(W / 2 - 160, 620 - rise * 0.3, 1.4, 1); drawCloud(W / 2 + 170, 640 - rise * 0.3, 1.2, 1);
      drawCrane(220 + (t * 40) % 900, 170, 1, t);
      drawSeal(60, 60, 64, 190, ['Phi', 'Thăng'], 24);
      text('Phi Thăng', W / 2, 90, 72, INK, 'center', 'bold');
      text(state.gained || '', W / 2, 150, 24, INK2);
      text(`Đột phá thành công ${state.tries - state.fails}/${state.tries} lần · Đạo tâm ${state.daotam}`, W / 2, 186, 20, INK2);
      text('Bấm hoặc Enter: tu lại từ đầu', W / 2, H - 30, 22, CINNABAR, 'center', 'bold');
      if (state.flash) { const k = state.flash.t / state.flash.dur; ctx.globalAlpha = Math.max(0, 1 - k); ctx.fillStyle = state.flash.c; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() {
  scenes[scene].draw();
  if (muted) text('tắt tiếng (M)', W - 20, H - 4 - 8, 14, scene === 'play' ? '#f3e9d4' : INK2, 'right');
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive ----------------------------------------------------
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

buildPaper(); buildRidges();
reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
